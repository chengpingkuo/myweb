<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bike Tour @ All AI Tools · versednet.com</title>
<meta name="description" content="Chengping Kuo's bike tour and travel pages, built with different AI tools.">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card-h:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px}
  header{text-align:center;margin-bottom:36px}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:8px}
  main{width:100%;max-width:640px}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:28px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  a.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:16px 18px;color:var(--text);text-decoration:none;font-weight:600;transition:background .15s,transform .15s}
  a.card:hover,a.card:focus{background:var(--card-h);transform:translateY(-2px)}
  a.card .icon{font-size:1.4rem}
  a.card small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
  footer{margin-top:auto;padding-top:48px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>🚴 My Bike Tour <span>@ All AI Tools</span></h1>
  <p>The same bike tour site, built by different AI assistants.</p>
</header>
<main>
  <h2>Built with AI</h2>
  <div class="grid">
    <a class="card" href="https://chengpingkuo.github.io/myweb/Gemini/" target="_blank" rel="noopener"><span class="icon">✨</span><span>Gemini<small>Google</small></span></a>
    <a class="card" href="https://chengpingkuo.github.io/myweb/ChatGPT/" target="_blank" rel="noopener"><span class="icon">💬</span><span>ChatGPT<small>OpenAI</small></span></a>
    <a class="card" href="https://chengpingkuo.github.io/myweb/Muse/" target="_blank" rel="noopener"><span class="icon">🎨</span><span>Muse<small>Meta</small></span></a>
    <a class="card" href="https://chengpingkuo.github.io/myweb/Claude/" target="_blank" rel="noopener"><span class="icon">📝</span><span>Claude<small>Anthropic</small></span></a>
    <a class="card" href="https://chengpingkuo.github.io/myweb/grok/" target="_blank" rel="noopener"><span class="icon">⚡</span><span>Grok<small>xAI</small></span></a>
    <a class="card" href="https://chengpingkuo.github.io/myweb/hark/" target="_blank" rel="noopener"><span class="icon">🎧</span><span>Hark</span></a>
  </div>
  <h2>My trips</h2>
  <div class="grid">
    <a class="card" href="https://chengpingkuo.github.io/myBikeTour/" target="_blank" rel="noopener"><span class="icon">🚲</span><span>My Bike Tour</span></a>
    <a class="card" href="https://chengpingkuo.github.io/myTravel/" target="_blank" rel="noopener"><span class="icon">🌏</span><span>My Travel</span></a>
  </div>
</main>
<footer>© 2026 Chengping Kuo · versednet.com</footer>
</body>
</html>
