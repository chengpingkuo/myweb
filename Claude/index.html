.year>h3{font:900 2rem/1 var(--serif);margin:0;color:var(--mute)}

.year li.rest{padding:6px 10px 6px 14px;color:var(--mute);border-left:4px dashed var(--line)}

.more{display:inline-block;margin:8px 0 0;font-weight:700;border-bottom:3px solid var(--gold)}
footer{margin:64px 0 40px;color:var(--mute);font-size:.9rem}

@media (prefers-reduced-motion:reduce){.card{transition:none}}
